name: build-binaries
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: sql-data-assistant-plugin
          - os: windows-latest
            platform: windows-x86_64
            exe: sql-data-assistant-plugin.exe
          - os: macos-14
            platform: darwin-arm64
            exe: sql-data-assistant-plugin
          - os: macos-15-intel
            platform: darwin-x86_64
            exe: sql-data-assistant-plugin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name sql-data-assistant-plugin tool/sql_data_assistant_plugin.py
      - name: Smoke test
        shell: bash
        run: echo '{"jsonrpc":"2.0","method":"describe","id":1}' | ./dist/${{ matrix.exe }}
      - name: Package
        shell: python
        run: |
          import os, shutil, json, tarfile, zipfile
          exe = "${{ matrix.exe }}"
          plat = "${{ matrix.platform }}"
          os.makedirs("pkg", exist_ok=True)
          shutil.copy("dist/" + exe, "pkg/" + exe)
          manifest = {
              "name": "tool-meghana-ai-sql-data-assistant-r446nerg",
              "version": "0.2.0",
              "runtime": {"binary": {"entrypoint": exe}},
          }
          with open("pkg/manifest.json", "w") as f:
              json.dump(manifest, f)
          base = "sql-data-assistant-plugin-" + plat
          if plat.startswith("windows"):
              with zipfile.ZipFile(base + ".zip", "w", zipfile.ZIP_DEFLATED) as z:
                  for name in os.listdir("pkg"):
                      z.write(os.path.join("pkg", name), name)
          else:
              with tarfile.open(base + ".tar.gz", "w:gz") as t:
                  for name in os.listdir("pkg"):
                      t.add(os.path.join("pkg", name), arcname=name)
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: |
            sql-data-assistant-plugin-*.tar.gz
            sql-data-assistant-plugin-*.zip
          if-no-files-found: ignore
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - run: sha256sum sql-data-assistant-plugin-*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          files: sql-data-assistant-plugin-*
